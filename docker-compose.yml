services:
  postgres:
    image: postgres:16-alpine
    container_name: reto-constancia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reto_constancia
    ports:
      - "5432:5432"
    volumes:
      - reto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reto_constancia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  reto_pgdata:
