name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Un push nuevo a un PR cancela la corrida anterior de ese PR (libera runners y evita colas
# que terminan en jobs cancelados). En main y develop cada push corre completo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reto_constancia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reto_constancia_test?schema=public
      JWT_SECRET: ci_only_jwt_secret_change_in_real_envs
      JWT_REFRESH_SECRET: ci_only_refresh_secret_change_in_real_envs
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3005
      API_PREFIX: api

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Sin dependencias: falla el PR si se versiona una clave, un token o un .env (docs/security-owasp.md)
      - run: node ../scripts/scan-secrets.mjs
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # Sin avisos abiertos: cualquier alerta moderada o mayor hace fallar el PR (ver docs/security-owasp.md)
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run test:e2e

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api
      - run: npm audit --omit=dev --audit-level=moderate

  e2e-ui:
    name: E2E de UI (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reto_constancia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reto_constancia_test?schema=public
      JWT_SECRET: e2e-ui-secret
      JWT_REFRESH_SECRET: e2e-ui-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      API_PREFIX: api
      PORT: 3002
      CORS_ORIGIN: http://localhost:3005
      NEXT_PUBLIC_API_URL: http://localhost:3002/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Backend (deps, migraciones, seed y build)
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run prisma:seed
          npm run build
      - name: Frontend (deps y build)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Playwright (deps y navegador)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Recorridos de UI
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
